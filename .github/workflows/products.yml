name: Plervo product candidates

on:
  workflow_dispatch:
    inputs:
      upstream_baseline:
        description: Re-run the untouched Slides baseline for source comparison
        type: boolean
        default: false
  pull_request:
    paths:
      - 'products/**'
      - 'assets/products/**'
      - 'xtask/src/products.rs'
      - '.github/workflows/products.yml'

permissions:
  contents: read

concurrency:
  group: products-${{ github.ref }}
  # Finish the current native diagnostics; a newer revision waits for the full matrix.
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: 'cargo test --locked -p xtask products::'
      - id: catalog
        run: echo "matrix=$(cargo xtask products --matrix)" >> "$GITHUB_OUTPUT"

  candidate:
    name: ${{ matrix.app.product }} (${{ matrix.os }})
    needs: catalog
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        app: ${{ fromJSON(needs.catalog.outputs.matrix).include }}
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: '1'
      UPSTREAM_APP: ${{ matrix.app.app }}
      PRODUCT: ${{ matrix.app.product }}
    steps:
      - name: Preserve source line endings on the isolated Windows runner
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read pinned public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.app.upstream }}
          ref: ${{ matrix.app.commit }}
          path: source
          persist-credentials: false
      - name: Read pinned fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: ${{ matrix.app.fonts }}
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            source -> target
          key: products-${{ matrix.app.product }}
          cache-on-failure: true
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libasound2-dev libudev-dev libva-dev libdrm-dev xvfb
      - name: Slides upstream baseline before adaptation
        if: runner.os == 'Linux' && matrix.app.product == 'slides' && inputs.upstream_baseline
        continue-on-error: true
        working-directory: source
        run: cargo xtask ci 2>&1 | tee "$GITHUB_WORKSPACE/slides-upstream-baseline.log"
      - name: Preserve the untouched Slides baseline result
        if: always() && runner.os == 'Linux' && matrix.app.product == 'slides' && inputs.upstream_baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: slides-upstream-baseline-${{ github.sha }}
          path: slides-upstream-baseline.log
          if-no-files-found: error
          retention-days: 14
      - name: Verify and apply the Plervo source overlay
        shell: bash
        run: cargo xtask products --prepare "$PRODUCT" "$GITHUB_WORKSPACE/source"
      - name: Build identity
        shell: bash
        run: |
          prefix="$(printf '%s' "$UPSTREAM_APP" | tr '[:lower:]' '[:upper:]')"
          echo "${prefix}_BUILD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "${prefix}_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          # The macOS runner exercises GPU effects; software-only runners still
          # verify composited output and the CPU effect fallback.
          if [ "$PRODUCT" = video ] && [ "$RUNNER_OS" = macOS ]; then
            echo 'PLERVO_REQUIRE_GPU_EFFECTS=1' >> "$GITHUB_ENV"
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            {
              echo 'CARGO_BUILD_TARGET=x86_64-pc-windows-msvc'
              echo 'CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static'
              echo "${prefix}_REQUIRE_WINRES=1"
            } >> "$GITHUB_ENV"
          fi
      - name: Formatting and source boundaries
        if: runner.os == 'Linux'
        working-directory: source
        run: |
          cargo fmt --all -- --check
          cargo xtask layers
      - name: Upstream asset attribution gate
        if: runner.os == 'Linux' && matrix.app.product != 'photo'
        working-directory: source
        run: cargo xtask assets
      - name: Generate the reviewed policy for this product
        shell: bash
        run: cargo xtask products --audit-policy "$PRODUCT" > products/deny-active.toml
      - name: Dependency licences and security advisories
        id: dependencies
        if: runner.os == 'Linux'
        # Continue native diagnostics, then fail the job below if this review failed.
        # No candidate from this workflow is eligible for public distribution.
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: source/Cargo.toml
          command: check
          arguments: --all-features --locked --config products/deny-active.toml
      - name: Static analysis
        id: static_analysis
        working-directory: source
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Collect further diagnostics after a failed strict check
        if: failure() && steps.static_analysis.outcome == 'failure'
        continue-on-error: true
        working-directory: source
        # Diagnostic pass only: the strict check above still fails the job, so no packages
        # are built/uploaded from this run. Continue across lint failures to report them all.
        run: cargo clippy --locked --workspace --all-targets --message-format=json -- --cap-lints warn > ../clippy-diagnostics.jsonl
      - name: Preserve compiler diagnostics
        if: failure() && steps.static_analysis.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-${{ matrix.app.product }}-${{ runner.os }}-${{ github.sha }}
          path: clippy-diagnostics.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Feature and regression tests
        working-directory: source
        run: cargo test --locked --workspace --no-fail-fast
      - name: Web target boundary
        if: runner.os == 'Linux'
        working-directory: source
        run: cargo xtask wasm
      - name: Build desktop and CLI
        working-directory: source
        shell: bash
        run: |
          features=()
          if [ "$PRODUCT" = photo ]; then features=(--features heif); fi
          cargo build --release --locked -p "plervo-$PRODUCT" -p "plervo-$PRODUCT-cli" "${features[@]}"
      - name: Headless executable checks
        working-directory: source
        shell: bash
        run: |
          bin=target/release
          ext=
          if [ "$RUNNER_OS" = Windows ]; then bin=target/x86_64-pc-windows-msvc/release; ext=.exe; fi
          "$bin/plervo-$PRODUCT$ext" --version
          "$bin/plervo-$PRODUCT-cli$ext" --help
      - name: Python for independent candidate file readers
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install hash-pinned acceptance readers
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r products/acceptance-requirements.txt
      - name: Audio native plugins with hardened-runtime entitlements
        if: runner.os == 'macOS' && matrix.app.product == 'audio'
        working-directory: source
        timeout-minutes: 10
        run: bash packaging/macos/test-plugins.sh dist/validation/hardened-plugins
      - name: Native release file operations and failure handling
        timeout-minutes: 10
        shell: bash
        run: |
          bin=source/target/release
          ext=
          if [ "$RUNNER_OS" = Windows ]; then bin=source/target/x86_64-pc-windows-msvc/release; ext=.exe; fi
          version="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          python products/accept_cli.py --product "$PRODUCT" --binary "$bin/plervo-$PRODUCT-cli$ext" \
            --output source/dist/validation/cli-release --expected-version "$version" \
            --source "native release candidate $GITHUB_SHA"
      - name: Linux internal packages
        if: runner.os == 'Linux'
        working-directory: source
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          go_path="$(go env GOPATH)"
          export PATH="$go_path/bin:$PATH"
          packaging/linux/package.sh --skip-build --formats 'deb rpm tar'
      - name: Linux installed binaries, reinstall and removal
        if: runner.os == 'Linux'
        working-directory: source
        shell: bash
        run: |
          packages=(dist/release/plervo-"$PRODUCT"-*-linux-x86_64.deb)
          [ "${#packages[@]}" = 1 ] && [ -f "${packages[0]}" ]
          app="/usr/bin/plervo-$PRODUCT"
          cli="/usr/bin/plervo-$PRODUCT-cli"
          [ ! -e "$app" ] && [ ! -e "$cli" ]
          mkdir -p dist/validation
          package="$(realpath "${packages[0]}")"
          cleanup() { sudo apt-get remove -y "plervo-$PRODUCT"; }
          sudo apt-get install -y --no-install-recommends "$package"
          trap cleanup EXIT
          "$app" --version
          "$cli" --version
          "$cli" --help > dist/validation/installed-cli-help.txt
          test -f "/usr/share/applications/com.plervo.$PRODUCT.desktop"
          sudo apt-get install -y --reinstall --no-install-recommends "$package"
          "$cli" --version
          cleanup
          trap - EXIT
          [ ! -e "$app" ] && [ ! -e "$cli" ]
          printf '%s\n' 'DEB install, installed binaries, desktop entry, reinstall and removal passed.' > dist/validation/linux-install.txt
      - name: Suite installs the real product archive
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        run: |
          cargo build --locked -p plervo-suite-native --example product_acceptance
          packages=(source/dist/release/plervo-"$PRODUCT"-*-linux-x86_64.tar.gz)
          [ "${#packages[@]}" = 1 ] && [ -f "${packages[0]}" ]
          PLERVO_ACCEPTANCE=1 timeout 90 target/debug/examples/product_acceptance "$PRODUCT" "${packages[0]}" \
            2>&1 | tee source/dist/validation/suite-install.txt
      - name: Debian and Fedora package acceptance
        if: runner.os == 'Linux'
        working-directory: source
        shell: bash
        run: |
          for image in debian:13 fedora:44; do
            evidence="$PWD/dist/validation/${image//:/-}"
            mkdir -p "$evidence"
            docker pull "$image"
            docker image inspect "$image" --format '{{json .RepoDigests}}' > "$evidence/container-digest.json"
            docker run --rm --network bridge -e PLERVO_ACCEPTANCE=1 -e PRODUCT \
              -v "$PWD/dist/release:/packages:ro" -v "$GITHUB_WORKSPACE/products:/test:ro" \
              -v "$evidence:/evidence" "$image" bash /test/test-linux-container.sh
          done
      - name: macOS internal package (not notarized)
        if: runner.os == 'macOS'
        working-directory: source
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p "target/$target/release"
          cp "target/release/plervo-$PRODUCT" "target/release/plervo-$PRODUCT-cli" "target/$target/release/"
          packaging/macos/package.sh --arch aarch64 --skip-build
      - name: macOS mounted bundle and standalone CLI
        if: runner.os == 'macOS'
        working-directory: source
        shell: bash
        run: |
          images=(dist/release/plervo-"$PRODUCT"-*-macos-aarch64.dmg)
          archives=(dist/release/plervo-"$PRODUCT"-cli-*-macos-aarch64.zip)
          [ "${#images[@]}" = 1 ] && [ -f "${images[0]}" ]
          [ "${#archives[@]}" = 1 ] && [ -f "${archives[0]}" ]
          work="$(mktemp -d "$RUNNER_TEMP/plervo-package.XXXXXX")"
          mount="$work/mounted"
          mkdir -p "$mount" dist/validation
          app_name="$(python3 -c 'import json,os,pathlib; print(next(p["name"] for p in json.loads((pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"products/sources.json").read_text()) if p["product"]==os.environ["PRODUCT"]))')"
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          bundle="$work/$app_name.app"
          ditto "$mount/$app_name.app" "$bundle"
          hdiutil detach "$mount"
          trap - EXIT
          codesign --verify --deep --strict "$bundle"
          [ "$(plutil -extract CFBundleIdentifier raw -o - "$bundle/Contents/Info.plist")" = "com.plervo.$PRODUCT" ]
          (cd "$GITHUB_WORKSPACE" && cargo build --locked -p plervo-suite-native --example product_acceptance)
          PLERVO_ACCEPTANCE=1 "$GITHUB_WORKSPACE/target/debug/examples/product_acceptance" "$PRODUCT" "$bundle" \
            | tee dist/validation/suite-bundle-identity.txt
          "$bundle/Contents/MacOS/$app_name" --version
          ditto -x -k "${archives[0]}" "$work/cli"
          cli=("$work"/cli/*/plervo-"$PRODUCT"-cli)
          [ "${#cli[@]}" = 1 ] && [ -x "${cli[0]}" ]
          "${cli[0]}" --help > dist/validation/standalone-cli-help.txt
          printf '%s\n' 'DMG mount/copy, bundle identity and ad-hoc signature, bundled app version and extracted standalone CLI passed. Developer ID and notarization remain required.' > dist/validation/macos-package.txt
      - name: Windows internal package (unsigned)
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          packaging/windows/package.ps1 -Arch x64 -SkipBuild
      - name: Windows installed binaries, repair and removal
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem "dist/release/plervo-$env:PRODUCT-*.msi")
          if ($packages.Count -ne 1) { throw 'Expected exactly one MSI candidate' }
          $catalog = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'products/sources.json') -Raw | ConvertFrom-Json
          $definition = @($catalog | Where-Object { $_.product -eq $env:PRODUCT })
          if ($definition.Count -ne 1) { throw 'Unknown product identity' }
          $install = Join-Path $env:ProgramFiles $definition[0].name
          if (Test-Path -LiteralPath $install) { throw 'Refusing to replace an existing installation' }
          $evidence = New-Item -ItemType Directory -Force dist/validation
          $expectedVersion = python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($expectedVersion)) { throw 'Cannot read candidate version' }
          function Invoke-CandidateMsi([string] $operation, [string] $label) {
            $log = Join-Path $evidence.FullName "windows-$label.log"
            $process = Start-Process msiexec.exe -ArgumentList @($operation, "`"$($packages[0].FullName)`"", '/qn', '/norestart', '/L*v', "`"$log`"") -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "MSI $label failed: $($process.ExitCode)" }
          }
          $installed = $false
          try {
            Invoke-CandidateMsi '/i' 'install'
            $installed = $true
            $desktop = Join-Path $install "plervo-$env:PRODUCT.exe"
            $cli = Join-Path $install "plervo-$env:PRODUCT-cli.exe"
            # A Windows GUI executable need not update PowerShell's LASTEXITCODE.
            # Wait for this exact process and preserve its output and exit status.
            $versionLog = Join-Path $evidence.FullName 'installed-app-version.txt'
            $versionError = Join-Path $evidence.FullName 'installed-app-version-stderr.txt'
            $desktopProcess = Start-Process -FilePath $desktop -ArgumentList '--version' -Wait -PassThru `
              -RedirectStandardOutput $versionLog -RedirectStandardError $versionError
            if ($desktopProcess.ExitCode -ne 0) { throw "Installed app version check failed: $($desktopProcess.ExitCode)" }
            $versionOutput = Get-Content -LiteralPath $versionLog -Raw
            if ([string]::IsNullOrWhiteSpace($versionOutput) -or -not $versionOutput.Trim().EndsWith(" $expectedVersion")) {
              throw 'Installed app reported a missing or unexpected version'
            }
            & $cli --help | Set-Content (Join-Path $evidence.FullName 'installed-cli-help.txt')
            if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed' }
            Invoke-CandidateMsi '/fa' 'repair'
            & $cli --version
            if ($LASTEXITCODE -ne 0) { throw 'Repaired CLI failed' }
          } finally {
            if ($installed) { Invoke-CandidateMsi '/x' 'uninstall' }
          }
          if ((Test-Path -LiteralPath $desktop) -or (Test-Path -LiteralPath $cli)) { throw 'Uninstall left a product executable' }
          'MSI install, installed binaries, repair and removal passed.' | Set-Content (Join-Path $evidence.FullName 'windows-install.txt')
      - name: Preserve native installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installation-${{ matrix.app.product }}-${{ runner.os }}-${{ github.sha }}
          path: source/dist/validation/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve qualification status and source provenance
        working-directory: source
        shell: bash
        run: |
          cp PLERVO-BUILD.json dist/release/
          printf '%s\n' 'Internal candidates. Not approved for public distribution. macOS is not notarized; Windows is unsigned. Native installation, security and product acceptance remain required.' > dist/release/INTERNAL-CANDIDATES.txt
      - name: Upload internal candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: internal-plervo-${{ matrix.app.product }}-${{ runner.os }}-${{ github.sha }}
          path: source/dist/release/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce dependency review result
        if: always() && runner.os == 'Linux' && steps.dependencies.outcome != 'success'
        run: |
          echo 'Dependency review did not pass. This candidate remains blocked.' >&2
          exit 1
