name: Linux Suite acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/plervo-suite/**'
      - 'crates/suite-native/**'
      - 'packaging/linux/**'
      - '.github/workflows/linux-suite.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-suite-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: linux-suite-release
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev desktop-file-utils
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Prove the non-UTF-8 process regression against the previous release
        shell: bash
        run: |
          cp crates/suite-native/src/process.rs "$RUNNER_TEMP/process-fixed.rs"
          trap 'cp "$RUNNER_TEMP/process-fixed.rs" crates/suite-native/src/process.rs' EXIT
          git fetch --no-tags --depth=1 origin daa041ec1c7a323d2820bf2d55ba6d60d8277aa3
          git show daa041ec1c7a323d2820bf2d55ba6d60d8277aa3:crates/suite-native/src/process.rs > crates/suite-native/src/process.rs
          if LC_ALL=C cargo test --locked -p plervo-suite-native --test linux_process > "$RUNNER_TEMP/before.txt" 2>&1; then
            cat "$RUNNER_TEMP/before.txt"
            echo 'Expected the old implementation to fail this regression.' >&2
            exit 1
          fi
          grep 'a_running_app_with_a_non_utf8_path_is_not_treated_as_stopped ... FAILED' "$RUNNER_TEMP/before.txt"
          mkdir -p dist/validation
          cp "$RUNNER_TEMP/before.txt" dist/validation/process-before.txt
      - name: Unit and locale regression checks
        run: |
          LC_ALL=C cargo test --locked -p plervo-suite-core -p plervo-suite-native -p plervo-suite
      - name: Build final release binaries
        run: |
          cargo build --release --locked -p plervo-suite -p plervo-pdf -p plervo-pdf-cli
          cargo build --release --locked -p plervo-suite-native --example linux_acceptance
      - name: Package Suite and PDF
        run: |
          packaging/linux/package.sh --skip-build --formats 'deb rpm tar cli'
          packaging/linux/suite.sh --skip-build
          mkdir -p dist/validation
          git rev-parse HEAD > dist/validation/source-commit.txt
          cp target/release/examples/linux_acceptance dist/validation/
          (cd dist/release && sha256sum ./*.deb ./*.rpm ./*.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-suite-candidates
          path: dist/release/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-acceptance-helper
          path: dist/validation/
          retention-days: 14
  desktop:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'ubuntu:26.04', 'debian:13', 'fedora:44']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download built candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n linux-suite-candidates -D dist/release
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n linux-acceptance-helper -D dist/validation
          chmod +x dist/validation/linux_acceptance
      - name: Clean distro install and desktop checks
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p dist/evidence
          docker pull "$TEST_IMAGE"
          docker image inspect "$TEST_IMAGE" --format '{{json .RepoDigests}}' > dist/evidence/container-digest.json
          docker run --rm --network bridge -e PLERVO_ACCEPTANCE=1 \
            -v "$PWD/dist/release:/packages:ro" -v "$PWD/dist/validation:/validation:ro" \
            -v "$PWD/packaging/linux:/test:ro" -v "$PWD/dist/evidence:/evidence" \
            "$TEST_IMAGE" bash /test/test-suite-container.sh
      - name: Keep public validation evidence
        if: always()
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          sudo rm -f dist/evidence/pdf-control.json
          echo "EVIDENCE_NAME=${TEST_IMAGE//:/-}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: linux-desktop-${{ env.EVIDENCE_NAME }}
          path: dist/evidence/
          retention-days: 14
